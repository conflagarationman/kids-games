<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Little Band!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Little Band">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd88a">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { background: linear-gradient(180deg, #ffd88a 0%, #ffb3a7 55%, #c9b8ff 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* Parent button: small, faded, needs a long press so little fingers don't open it */
  #parentBtn { position: fixed; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.35); font-size: 20px; z-index: 3; touch-action: none; }
  #parentBtn .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #ff6fb1; clip-path: inset(0 0 100% 0); }
  #parentBtn.holding .ring { animation: fill 1.5s linear forwards; }
  @keyframes fill { to { clip-path: inset(0 0 0 0); } }

  #panel { position: fixed; inset: 0; background: rgba(43,45,92,.45); display: none; align-items: center; justify-content: center; z-index: 5; overflow-y: auto; padding: 16px 0; }
  #panel.open { display: flex; }
  .card { background: #fff; border-radius: 24px; padding: 20px 22px; width: min(420px, 92%); color: #2b2d5c; box-shadow: 0 12px 40px rgba(0,0,0,.25); margin: auto; }
  .card h2 { margin: 0 0 4px; }
  .card p { margin: 0 0 14px; font-size: 13px; opacity: .7; }
  .label { font-weight: 800; font-size: 14px; margin: 12px 0 6px; }
  .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .modes button, .toggles button, .done { padding: 12px 8px; border-radius: 14px; border: 3px solid transparent; background: #eef0ff; font-weight: 800; font-size: 15px; color: #2b2d5c; cursor: pointer; }
  .modes button.on { border-color: #38c6f4; background: #e3f7ff; }
  .toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .toggles button.off { opacity: .45; }
  .done { width: 100%; margin-top: 16px; background: #ff6fb1; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="parentBtn" aria-label="Grown-up settings (press and hold)">⚙️<span class="ring"></span></button>

<div id="panel">
  <div class="card">
    <h2>Grown-up settings</h2>
    <p>A real keyboard: hold a key to keep the note ringing, slide along to run up and down. Tap 🎹 🔔 🎸 🎺 to change the sound. Press and hold the ⚙️ to get back here.</p>
    <div class="label">Play-along beat</div>
    <div class="modes">
      <button data-beat="0">🤫 No beat</button>
      <button data-beat="80">🐢 Slow beat</button>
      <button data-beat="104">🐇 Bouncy beat</button>
      <button data-beat="132">🚀 Dance beat</button>
    </div>
    <div class="label">On the keys</div>
    <div class="modes">
      <button data-labels="colors">🌈 Color dots</button>
      <button data-labels="letters">🔤 Note letters</button>
    </div>
    <div class="label">How many keys?</div>
    <div class="modes">
      <button data-range="1">1 octave (bigger keys)</button>
      <button data-range="2">2 octaves</button>
    </div>
    <div class="label">Sound</div>
    <div class="toggles">
      <button id="tSound">🔊 Sounds</button>
      <button id="tFull" style="grid-column: span 2">⛶ Full screen</button>
    </div>
    <button class="done" id="done">Let's play!</button>
  </div>
</div>

<script>
(() => {
  // ---------- Settings (only settings are saved) ----------
  const KEY = 'littleBand.kids.v2';
  let settings = { beat: 0, labels: 'colors', range: 0, sound: true, voice: 'piano' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };

  // ---------- Audio: every instrument is made right here, no sound files ----------
  let actx = null, master = null, noiseBuf = null;
  function audio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  const midiFreq = m => 440 * 2 ** ((m - 69) / 12);

  // Keyboard sounds. Each note holds while the key is down and lets go when it lifts.
  // parts: [wave, frequency multiple, level]; tau: how fast a held note fades (0 = keeps going)
  const VOICES = {
    piano: { icon: '🎹', parts: [['triangle', 1, 1], ['sine', 2, 0.3], ['sine', 3, 0.08]], peak: 0.3, attack: 0.005, tau: 0.7, release: 0.08 },
    bells: { icon: '🔔', parts: [['sine', 2, 1], ['sine', 6.02, 0.25], ['sine', 10.8, 0.08]], peak: 0.22, attack: 0.003, tau: 1.1, release: 0.5 },
    guitar: { icon: '🎸', parts: [['sawtooth', 0.5, 0.7], ['triangle', 0.5, 0.6]], peak: 0.28, attack: 0.004, tau: 0.45, release: 0.1, filter: 1600, sweep: 500 },
    horn: { icon: '🎺', parts: [['square', 1, 0.6], ['sawtooth', 1.004, 0.5]], peak: 0.13, attack: 0.06, tau: 0, release: 0.1, filter: 1500 },
  };
  function startVoice(name, freq) {
    const v = VOICES[name], t = actx.currentTime;
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v.peak, t + v.attack);
    if (v.tau) g.gain.setTargetAtTime(0, t + v.attack, v.tau);
    let out = g;
    if (v.filter) {
      const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(v.filter, t);
      if (v.sweep) f.frequency.setTargetAtTime(v.sweep, t, 0.15); // a pluck that mellows out
      g.connect(f); out = f;
    }
    out.connect(master);
    const oscs = v.parts.map(([type, mul, lvl]) => {
      const o = actx.createOscillator(), og = actx.createGain();
      o.type = type; o.frequency.value = freq * mul; og.gain.value = lvl;
      o.connect(og).connect(g); o.start(t);
      return o;
    });
    return {
      stop() {
        const now = actx.currentTime;
        if (g.gain.cancelAndHoldAtTime) g.gain.cancelAndHoldAtTime(now);
        else { g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); }
        g.gain.setTargetAtTime(0, now, v.release);
        oscs.forEach(o => o.stop(now + v.release * 8));
      },
    };
  }
  function env(g, t, peak, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function noise(t, dur, peak, type, freq) {
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    env(g, t, peak, 0.003, dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  function kick(t, peak = 0.6) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.3);
    env(g, t, peak, 0.005, 0.35);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
  }
  const PADS = {
    drum(t) { kick(t); noise(t, 0.08, 0.12, 'lowpass', 1200); },
    clap(t) { [0, 0.012, 0.026].forEach(d => noise(t + d, 0.09, 0.35, 'bandpass', 1500)); },
  };

  // ---------- Play-along beat (scheduled ahead on the audio clock so it never drifts) ----------
  let nextBeat = 0, beatN = 0, beatPulse = 0;
  const beatTimes = [];
  function scheduleBeat() {
    if (!settings.beat || !settings.sound || !actx || actx.state !== 'running') { nextBeat = 0; return; }
    const spb = 60 / settings.beat / 2; // eighth notes
    if (nextBeat < actx.currentTime) { nextBeat = actx.currentTime + 0.05; beatN = 0; }
    while (nextBeat < actx.currentTime + 0.12) {
      const t = nextBeat;
      if (beatN % 4 === 0) { kick(t, 0.35); beatTimes.push(t); }
      if (beatN % 4 === 2) noise(t, 0.1, 0.08, 'bandpass', 1800);
      noise(t, 0.04, 0.03, 'highpass', 7000);
      nextBeat += spb; beatN++;
    }
  }
  setInterval(scheduleBeat, 25);

  // ---------- Canvas & layout ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const unit = () => Math.min(W, H);

  // Classroom bell colors for C D E F G A B, so a song can be taught by color
  const NOTE_COLORS = ['#ff3b3b', '#ff9a1f', '#f5c800', '#22b84a', '#2f9bff', '#7a4dff', '#ff4fb0'];
  const NOTE_NAMES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const WHITE_STEPS = [0, 2, 4, 5, 7, 9, 11];
  const HAS_BLACK = [true, true, false, true, true, true, false]; // a black key sits after C D F G A

  let keys = [], buttons = [];
  function layout() {
    const padX = Math.max(12, W * 0.03);
    // instrument row up top, clear of the ⚙️ corner
    const stripTop = Math.max(64, H * 0.07), stripH = Math.max(60, Math.min(110, unit() * 0.16));
    const order = ['drum', 'piano', 'bells', 'guitar', 'horn', 'clap'];
    const cw = (W - padX * 2) / order.length;
    const r = Math.min(stripH / 2, cw / 2) * 0.86;
    const oldBtn = buttons;
    buttons = order.map((id, i) => ({ id, x: padX + cw * (i + 0.5), y: stripTop + stripH / 2, r,
      icon: id === 'drum' ? '🥁' : id === 'clap' ? '👏' : VOICES[id].icon, pad: !VOICES[id],
      bounce: (oldBtn.find(b => b.id === id) || {}).bounce || 0 }));

    // the keyboard fills the rest, kept off the very bottom edge where wrists rest
    const top = stripTop + stripH + Math.max(14, H * 0.03), bottom = H - Math.max(20, H * 0.05);
    // pick a range that keeps white keys wide enough for small fingers
    const auto = (W - padX * 2) / 15 >= 52 ? 2 : 1;
    const octaves = settings.range || auto;
    const nWhite = octaves * 7 + 1; // end on the top C
    const ww = (W - padX * 2) / nWhite, kh = bottom - top;
    keys = [];
    for (let i = 0; i < nWhite; i++) {
      const deg = i % 7, oct = (i / 7) | 0, midi = 60 + oct * 12 + WHITE_STEPS[deg];
      keys.push({ white: true, midi, deg, x: padX + i * ww, y: top, w: ww, h: kh, color: NOTE_COLORS[deg], name: NOTE_NAMES[deg] });
    }
    for (let i = 0; i < nWhite - 1; i++) {
      const deg = i % 7; if (!HAS_BLACK[deg]) continue;
      const bw = ww * 0.6, midi = keys[i].midi + 1;
      keys.push({ white: false, midi, deg, x: padX + (i + 1) * ww - bw / 2, y: top, w: bw, h: kh * 0.6, color: NOTE_COLORS[deg] });
    }
  }
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    releaseAll(); layout();
  }

  // ---------- Playing ----------
  const fingers = new Map(); // pointerId -> { key, voice } or { button }
  const held = new Map();    // midi -> how many fingers are on it (for drawing)
  const notes = [];

  function keyAt(x, y) {
    // black keys sit on top, so check them first
    for (const k of keys) if (!k.white && x >= k.x && x < k.x + k.w && y >= k.y && y < k.y + k.h) return k;
    for (const k of keys) if (k.white && x >= k.x && x < k.x + k.w && y >= k.y - 8 && y < k.y + k.h + 16) return k;
    return null;
  }
  function buttonAt(x, y) {
    return buttons.find(b => (b.x - x) ** 2 + (b.y - y) ** 2 <= (b.r + 10) ** 2) || null;
  }
  function pressKey(k) {
    held.set(k.midi, (held.get(k.midi) || 0) + 1);
    notes.push({ x: k.x + k.w / 2, y: k.y - 6, vx: (Math.random() - 0.5) * 40, t: 0, color: k.color,
      glyph: ['♪', '♫', '♩', '♬'][(Math.random() * 4) | 0], size: Math.max(22, unit() * 0.06) });
    if (!settings.sound || !audio()) return null;
    return startVoice(settings.voice, midiFreq(k.midi));
  }
  function releaseKey(f) {
    if (!f || !f.key) return;
    const n = (held.get(f.key.midi) || 1) - 1;
    n ? held.set(f.key.midi, n) : held.delete(f.key.midi);
    if (f.voice) f.voice.stop();
  }
  function releaseAll() { for (const f of fingers.values()) releaseKey(f); fingers.clear(); held.clear(); }

  function tapButton(b) {
    b.bounce = 1;
    if (!audio()) return;
    if (b.pad) { if (settings.sound) PADS[b.id](actx.currentTime); return; }
    settings.voice = b.id; saveSettings();
    // a quick hello in the new sound
    if (settings.sound) { const v = startVoice(b.id, midiFreq(67)); setTimeout(() => v.stop(), 250); }
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    const b = buttonAt(e.clientX, e.clientY);
    if (b) { tapButton(b); fingers.set(e.pointerId, { button: b }); return; }
    const k = keyAt(e.clientX, e.clientY);
    fingers.set(e.pointerId, k ? { key: k, voice: pressKey(k) } : {});
  });
  cv.addEventListener('pointermove', e => {
    const f = fingers.get(e.pointerId);
    if (!f || f.button) return;
    // slide along the keys: let go of the old note, play the new one
    const k = keyAt(e.clientX, e.clientY);
    if (k === (f.key || null)) return;
    releaseKey(f);
    fingers.set(e.pointerId, k ? { key: k, voice: pressKey(k) } : {});
  });
  const lift = e => { releaseKey(fingers.get(e.pointerId)); fingers.delete(e.pointerId); };
  addEventListener('pointerup', lift); addEventListener('pointercancel', lift);
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch zoom

  addEventListener('resize', resize); resize();

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.closePath();
  }
  function drawButton(b) {
    const on = !b.pad && settings.voice === b.id;
    const s = 1 + Math.sin(b.bounce * Math.PI) * 0.15 + (b.pad ? beatPulse * 0.06 : 0);
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(s, s);
    ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
    if (on) { ctx.lineWidth = Math.max(4, b.r * 0.1); ctx.strokeStyle = '#ff6fb1'; ctx.stroke(); }
    ctx.globalAlpha = on || b.pad ? 1 : 0.7;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${b.r * 1.1}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText(b.icon, 0, b.r * 0.06);
    ctx.restore();
  }
  function drawKey(k) {
    const down = held.has(k.midi), r = Math.min(12, k.w * 0.18);
    const dy = down ? 4 : 0;
    if (k.white) {
      ctx.fillStyle = down ? k.color : '#fffdf8';
      roundRect(k.x + 2, k.y + dy, k.w - 4, k.h - dy, r); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(43,45,92,.25)'; ctx.stroke();
      // the label sits near the bottom where a finger doesn't cover it
      const cx = k.x + k.w / 2, cy = k.y + k.h - Math.min(k.w * 0.5, k.h * 0.12);
      if (settings.labels === 'letters') {
        ctx.font = `900 ${Math.min(k.w * 0.5, 34)}px "Arial Rounded MT Bold","Trebuchet MS",sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = down ? '#fff' : k.color; ctx.fillText(k.name, cx, cy);
      } else {
        ctx.fillStyle = down ? '#fff' : k.color;
        ctx.beginPath(); ctx.arc(cx, cy, Math.min(k.w * 0.22, 18), 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.fillStyle = down ? k.color : '#2b2d5c';
      roundRect(k.x, k.y + dy, k.w, k.h - dy, r * 0.7); ctx.fill();
      // a darker shade when pressed, so it doesn't merge with the white key next to it
      if (down) { ctx.fillStyle = 'rgba(43,45,92,.35)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#2b2d5c'; ctx.stroke(); }
      if (!down) { ctx.fillStyle = 'rgba(255,255,255,.18)'; roundRect(k.x + k.w * 0.18, k.y + 4, k.w * 0.64, k.h * 0.75, r * 0.5); ctx.fill(); }
    }
  }

  let last = performance.now();
  function update(dt) {
    for (const b of buttons) b.bounce = Math.max(0, b.bounce - dt * 3);
    // pulse the drum and clap pads on the beat as the audio clock reaches it
    if (actx) while (beatTimes.length && beatTimes[0] <= actx.currentTime) { beatTimes.shift(); beatPulse = 1; }
    beatPulse = Math.max(0, beatPulse - dt * 4);
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i]; n.t += dt; n.y -= unit() * 0.15 * dt; n.x += (n.vx + Math.sin(n.t * 6) * 30) * dt;
      if (n.t > 1.1) notes.splice(i, 1);
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const b of buttons) drawButton(b);
    for (const k of keys) if (k.white) drawKey(k);
    for (const k of keys) if (!k.white) drawKey(k);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const n of notes) {
      ctx.globalAlpha = Math.max(0, 1 - n.t / 1.1);
      ctx.font = `900 ${n.size}px "Arial Rounded MT Bold","Trebuchet MS",sans-serif`;
      ctx.lineWidth = n.size * 0.12; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(n.glyph, n.x, n.y); ctx.fillStyle = n.color; ctx.fillText(n.glyph, n.x, n.y);
    }
    ctx.globalAlpha = 1;
  }
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  // ---------- Grown-up panel (press & hold 1.5s) ----------
  const pb = document.getElementById('parentBtn'), panel = document.getElementById('panel');
  let holdTimer = null;
  const startHold = e => { e.preventDefault(); pb.classList.add('holding'); holdTimer = setTimeout(openPanel, 1500); };
  const endHold = () => { pb.classList.remove('holding'); clearTimeout(holdTimer); };
  pb.addEventListener('pointerdown', startHold);
  pb.addEventListener('pointerup', endHold); pb.addEventListener('pointerleave', endHold); pb.addEventListener('pointercancel', endHold);

  function openPanel() { endHold(); releaseAll(); syncPanel(); panel.classList.add('open'); }
  function syncPanel() {
    document.querySelectorAll('[data-beat]').forEach(b => b.classList.toggle('on', +b.dataset.beat === settings.beat));
    document.querySelectorAll('[data-labels]').forEach(b => b.classList.toggle('on', b.dataset.labels === settings.labels));
    const range = settings.range || ((W - Math.max(12, W * 0.03) * 2) / 15 >= 52 ? 2 : 1);
    document.querySelectorAll('[data-range]').forEach(b => b.classList.toggle('on', +b.dataset.range === range));
    document.getElementById('tSound').classList.toggle('off', !settings.sound);
  }
  document.querySelectorAll('[data-beat]').forEach(b => b.onclick = () => { settings.beat = +b.dataset.beat; saveSettings(); syncPanel(); audio(); });
  document.querySelectorAll('[data-labels]').forEach(b => b.onclick = () => { settings.labels = b.dataset.labels; saveSettings(); syncPanel(); });
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { settings.range = +b.dataset.range; saveSettings(); layout(); syncPanel(); });
  document.getElementById('tSound').onclick = () => { settings.sound = !settings.sound; saveSettings(); syncPanel(); };
  document.getElementById('tFull').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  };
  document.getElementById('done').onclick = () => { panel.classList.remove('open'); audio(); };

  requestAnimationFrame(loop);

  // Offline support (only works over HTTPS or localhost)
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
