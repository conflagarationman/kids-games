<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#ffab9e"/>
      <stop offset="1" stop-color="#c3b2ff"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2b2d5c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- stage lights -->
  <path d="M220 0 L 120 300 L 330 300 Z" fill="url(#spot)" opacity="0.6"/>
  <path d="M580 0 L 470 300 L 680 300 Z" fill="url(#spot)" opacity="0.6"/>
  <!-- confetti -->
  <g opacity="0.9">
    <rect x="80" y="60" width="16" height="9" rx="2" fill="#2f7bff" transform="rotate(25 88 64)"/>
    <rect x="700" y="40" width="16" height="9" rx="2" fill="#22b84a" transform="rotate(-30 708 44)"/>
    <rect x="420" y="30" width="14" height="8" rx="2" fill="#ff4fb0" transform="rotate(40 427 34)"/>
    <rect x="740" y="210" width="14" height="8" rx="2" fill="#f5c800" transform="rotate(10 747 214)"/>
    <rect x="40" y="230" width="14" height="8" rx="2" fill="#a04dff" transform="rotate(-20 47 234)"/>
  </g>
  <!-- the instruments, playing along -->
  <g filter="url(#shadow)" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">
    <text x="120" y="230" font-size="96" transform="rotate(-10 120 195)">🥁</text>
    <text x="300" y="150" font-size="84" transform="rotate(8 300 120)">🎺</text>
    <text x="520" y="170" font-size="90" transform="rotate(-12 520 135)">🎸</text>
    <text x="690" y="250" font-size="80" transform="rotate(12 690 220)">🔔</text>
  </g>
  <!-- notes floating up from the key being played -->
  <g filter="url(#shadow)">
    <g transform="translate(242.0 262) rotate(-8) scale(0.9)" fill="#2f9bff" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><ellipse cx="0" cy="0" rx="17" ry="13" transform="rotate(-20)"/><rect x="11" y="-62" width="7" height="62" rx="3"/><path d="M14 -62 q 26 10 22 38 q -6 -18 -22 -20 z"/></g>
    <g transform="translate(312.0 200) rotate(10) scale(0.8)" fill="#ff4fb0" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><ellipse cx="0" cy="0" rx="16" ry="12" transform="rotate(-20)"/><ellipse cx="46" cy="-10" rx="16" ry="12" transform="rotate(-20 46 -10)"/><rect x="10" y="-62" width="7" height="62" rx="3"/><rect x="56" y="-72" width="7" height="62" rx="3"/><path d="M10 -62 L 63 -72 L 63 -58 L 10 -48 Z"/></g>
    <g transform="translate(182.0 150) rotate(-14) scale(0.7)" fill="#7a4dff" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><ellipse cx="0" cy="0" rx="17" ry="13" transform="rotate(-20)"/><rect x="11" y="-62" width="7" height="62" rx="3"/><path d="M14 -62 q 26 10 22 38 q -6 -18 -22 -20 z"/></g>
    <g transform="translate(640 120) rotate(12) scale(0.75)" fill="#22b84a" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><ellipse cx="0" cy="0" rx="17" ry="13" transform="rotate(-20)"/><rect x="11" y="-62" width="7" height="62" rx="3"/><path d="M14 -62 q 26 10 22 38 q -6 -18 -22 -20 z"/></g>
    <g transform="translate(170 80) rotate(-10) scale(0.7)" fill="#ff9a1f" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><ellipse cx="0" cy="0" rx="16" ry="12" transform="rotate(-20)"/><ellipse cx="46" cy="-10" rx="16" ry="12" transform="rotate(-20 46 -10)"/><rect x="10" y="-62" width="7" height="62" rx="3"/><rect x="56" y="-72" width="7" height="62" rx="3"/><path d="M10 -62 L 63 -72 L 63 -58 L 10 -48 Z"/></g>
  </g>
