<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Magic Paint!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Magic Paint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff6e9">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { background: #fff6e9; transition: background .4s; }
  body.night { background: radial-gradient(circle at 50% 30%, #2a2f6b 0%, #14163a 70%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* Parent button: small, faded, needs a long press so little fingers don't open it */
  #parentBtn { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.35); font-size: 20px; z-index: 3; touch-action: none; }
  #parentBtn .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #ff6fb1; clip-path: inset(0 0 100% 0); }
  #parentBtn.holding .ring { animation: fill 1.5s linear forwards; }
  @keyframes fill { to { clip-path: inset(0 0 0 0); } }

  /* Kid color buttons along the top, away from the bottom edge where wrists rest */
  #palette { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); display: flex; gap: 8px; z-index: 2; }
  #palette.hidden { display: none; }
  /* a row across the top when wide, a column down the left when tall, so buttons stay finger-sized */
  #palette button { --s: min(64px, calc((100vw - 130px) / 8)); width: var(--s); height: var(--s); border-radius: 50%; border: 4px solid #fff; padding: 0; box-shadow: 0 3px 10px rgba(43,45,92,.25); transition: transform .15s; touch-action: none; }
  #palette button.on { transform: scale(1.18); box-shadow: 0 0 0 4px #2b2d5c, 0 3px 10px rgba(43,45,92,.25); }
  @media (orientation: portrait) { #palette { flex-direction: column; } #palette button { --s: min(64px, calc((100vh - 140px) / 8)); } }
  #palette button.page { background: #fff; font-size: calc(var(--s) * 0.5); line-height: 1; border-color: #ffd23f; }
  /* big screens: every coloring page as a picture tile down the right side */
  #pages { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 8px; z-index: 2; }
  #pages.show { display: flex; }
  #pages button { --s: min(72px, calc((100vh - 170px) / 9 - 8px)); width: var(--s); height: var(--s); border-radius: 16px; border: 4px solid #fff; padding: 0; background: #fff center / 88% no-repeat; font-size: calc(var(--s) * 0.5); line-height: 1; box-shadow: 0 3px 10px rgba(43,45,92,.25); transition: transform .15s; touch-action: none; }
  #pages button.on { transform: scale(1.12); box-shadow: 0 0 0 4px #2b2d5c, 0 3px 10px rgba(43,45,92,.25); }
  #palette button[data-color="rainbow"] { background: conic-gradient(#ff3b3b, #ff9a1f, #f5c800, #22b84a, #2f7bff, #a04dff, #ff3b3b); }
  #panel { position: fixed; inset: 0; background: rgba(43,45,92,.45); display: none; align-items: center; justify-content: center; z-index: 5; overflow-y: auto; padding: 16px 0; }
  #panel.open { display: flex; }
  .card { background: #fff; border-radius: 24px; padding: 20px 22px; width: min(420px, 92%); color: #2b2d5c; box-shadow: 0 12px 40px rgba(0,0,0,.25); margin: auto; }
  .card h2 { margin: 0 0 4px; }
  .card p { margin: 0 0 14px; font-size: 13px; opacity: .7; }
  .label { font-weight: 800; font-size: 14px; margin: 12px 0 6px; }
  .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .modes button, .toggles button, .done { padding: 12px 8px; border-radius: 14px; border: 3px solid transparent; background: #eef0ff; font-weight: 800; font-size: 15px; color: #2b2d5c; cursor: pointer; }
  .modes button.on { border-color: #38c6f4; background: #e3f7ff; }
  .toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .toggles button.off { opacity: .45; }
  .done { width: 100%; margin-top: 16px; background: #ff6fb1; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="pages" aria-label="Pictures to color"></div>
<div id="palette" aria-label="Paint colors">
  <button data-color="rainbow" aria-label="Rainbow"></button>
  <button data-color="#ff3b3b" style="background:#ff3b3b" aria-label="Red"></button>
  <button data-color="#ff9a1f" style="background:#ff9a1f" aria-label="Orange"></button>
  <button data-color="#f5c800" style="background:#f5c800" aria-label="Yellow"></button>
  <button data-color="#22b84a" style="background:#22b84a" aria-label="Green"></button>
  <button data-color="#2f7bff" style="background:#2f7bff" aria-label="Blue"></button>
  <button data-color="#a04dff" style="background:#a04dff" aria-label="Purple"></button>
  <button class="page" aria-label="Next picture to color">🖼️</button>
</div>

<button id="parentBtn" aria-label="Grown-up settings (press and hold)">⚙️<span class="ring"></span></button>

<div id="panel">
  <div class="card">
    <h2>Grown-up settings</h2>
    <p>Drag to paint, tap to stamp. Press and hold the ⚙️ to get back here.</p>
    <div class="label">Paint colors</div>
    <div class="modes">
      <button data-brush="rainbow">🌈 Rainbow</button>
      <button data-brush="crayons">🖍️ Surprise colors</button>
    </div>
    <div class="label">Brush</div>
    <div class="modes">
      <button data-bstyle="smooth">🖌️ Smooth</button>
      <button data-bstyle="crayon">🖍️ Crayon</button>
    </div>
    <div class="label">Color buttons for kids</div>
    <div class="modes">
      <button data-palette="show">🎨 Show</button>
      <button data-palette="hide">🙈 Hide</button>
    </div>
    <div class="label">Brush size</div>
    <div class="modes" style="grid-template-columns: repeat(3, 1fr)">
      <button data-size="0.6">Thin</button>
      <button data-size="1">Medium</button>
      <button data-size="1.7">Fat</button>
    </div>
    <div class="label">Stamps</div>
    <div class="modes">
      <button data-stamps="animals">🐶 Animals</button>
      <button data-stamps="shapes">⭐ Shapes</button>
      <button data-stamps="nature">🌸 Nature</button>
      <button data-stamps="mix">🎉 Mix it up</button>
    </div>
    <div class="label">Picture to color (tap a shape to fill it)</div>
    <div class="modes" style="grid-template-columns: repeat(3, 1fr)">
      <button data-page="">⬜ Blank</button>
      <button data-page="sun">☀️ Sun</button>
      <button data-page="fish">🐟 Fish</button>
      <button data-page="house">🏠 House</button>
      <button data-page="car">🚗 Car</button>
      <button data-page="flower">🌸 Flower</button>
      <button data-page="butterfly">🦋 Butterfly</button>
      <button data-page="cat">🐱 Cat</button>
      <button data-page="star">⭐ Star</button>
    </div>
    <div class="label">Paper</div>
    <div class="modes">
      <button data-paper="day">☀️ Day</button>
      <button data-paper="night">🌙 Night (glow)</button>
    </div>
    <div class="label">Picture</div>
    <div class="toggles">
      <button id="tSound">🔊 Sounds</button>
      <button id="tSave">💾 Save</button>
      <button id="tClear">🧽 Clear</button>
    </div>
    <div class="toggles" style="margin-top: 8px">
      <button id="tFull" style="grid-column: span 3">⛶ Full screen</button>
    </div>
    <button class="done" id="done">Let's paint!</button>
  </div>
</div>

<script>
(() => {
  // ---------- Content ----------
  const STAMPS = {
    animals: ['🐶', '🐱', '🐮', '🐷', '🦆', '🐸', '🦁', '🐰', '🐻', '🐧', '🐵', '🦖'],
    shapes:  ['⭐', '❤️', '🟣', '🔷', '🟡', '🟩', '🔺'],
    nature:  ['🌸', '🌻', '🌈', '☀️', '🌙', '🍎', '🍓', '🦋', '🐞', '🍄'],
  };
  STAMPS.mix = [...STAMPS.animals, ...STAMPS.shapes, ...STAMPS.nature];
  const BRIGHT = ['#ff3b3b', '#ff9a1f', '#f5c800', '#22b84a', '#2f7bff', '#a04dff', '#ff4fb0'];
  const pick = a => a[(Math.random() * a.length) | 0];
  const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  // ---------- Settings (only settings are saved) ----------
  const KEY = 'magicPaint.kids.v1';
  // brush is 'rainbow', 'crayons' (a surprise color each stroke) or a color the kid picked
  let settings = { brush: 'rainbow', brushStyle: 'smooth', stamps: 'mix', paper: 'day', sound: true, palette: 'show', size: '1', page: '' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };
  const applyPaper = () => document.body.classList.toggle('night', settings.paper === 'night');
  applyPaper();

  // ---------- Canvas: a paint layer that keeps the picture, drawn under live effects ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const paint = document.createElement('canvas'), pctx = paint.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const sp of stickers.values()) sp.c.width = 0; // size buckets change with the screen
    stickers.clear();
    // keep the picture when the screen rotates or resizes
    const keep = document.createElement('canvas');
    keep.width = paint.width; keep.height = paint.height;
    if (paint.width) keep.getContext('2d').drawImage(paint, 0, 0);
    cv.width = paint.width = W * dpr; cv.height = paint.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    if (keep.width) pctx.drawImage(keep, 0, 0);
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // a coloring page stays where it is (so the paint still lines up) unless it no longer fits
    if (page && (page.cx - page.S < 0 || page.cx + page.S > W || page.cy - page.S < 0 || page.cy + page.S > H)) { clearPaint(); page = { name: page.name, ...pageBox() }; }
    drawOutline();
  }
  addEventListener('resize', resize);
  const unit = () => Math.min(W, H);

  // ---------- Audio ----------
  let actx = null, master = null;
  function audio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        // everything goes through one limiter, so a pile of taps can't clip. The compressor adds about 5.4 dB of makeup gain on its own,
        // which the master gain takes back off, so a single sound is as loud as it was before the limiter
        master = actx.createGain(); master.gain.value = 0.54;
        const lim = actx.createDynamicsCompressor();
        lim.threshold.value = -12; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = 0.003; lim.release.value = 0.25;
        master.connect(lim); lim.connect(actx.destination);
      } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  // Major pentatonic, so any wiggle of paint sounds like a little tune
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
  function tone(freq, start, dur, type = 'sine', vol = 0.18) {
    const a = actx; if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(master); o.start(start); o.stop(start + dur + 0.02);
  }
  // higher on the screen = higher note
  function brushNote(y) {
    if (!settings.sound || !audio()) return;
    const i = Math.max(0, Math.min(NOTES.length - 1, Math.round((1 - y / H) * (NOTES.length - 1))));
    tone(NOTES[i], actx.currentTime, 0.3, 'sine', 0.06);
  }
  function stampSound() {
    if (!settings.sound || !audio()) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(660, t + 0.09);
    g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.16);
    tone(pick(NOTES), t + 0.06, 0.4, 'triangle', 0.12);
  }
  function whooshSound() {
    if (!settings.sound || !audio()) return;
    const t = actx.currentTime;
    [7, 5, 4, 2, 0].forEach((n, i) => tone(NOTES[n], t + i * 0.07, 0.35, 'triangle', 0.1));
  }

  // ---------- Painting ----------
  let hue = (Math.random() * 360) | 0;
  const strokes = new Map(); // pointerId -> stroke in progress
  const sparks = [], stamps = [];
  const brushWidth = () => Math.max(10, unit() * 0.035) * +settings.size;
  const night = () => settings.paper === 'night';

  // rainbow moves with distance painted, so it looks the same on fast and slow screens
  function strokeColor(s, dist) {
    if (settings.brush === 'rainbow') { hue = (hue + dist * 360 / (unit() * 1.5)) % 360; return `hsl(${hue},95%,${night() ? 65 : 55}%)`; }
    return settings.brush === 'crayons' ? s.color : settings.brush;
  }

  // One piece of line: a gradient from the old color to the new one with flat ends. The round join is only ever painted where
  // there was no paint yet (a wedge on the outside of a turn, a half-circle past the end), because a whole round cap repaints the
  // older colors behind it and shows as beads where the colors differ.
  function brushPiece(s, g, x0, y0, x1, y1, c0, c1, w) {
    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.01) return;
    const ang = Math.atan2(y1 - y0, x1 - x0), r = w / 2;
    if (s.dir !== undefined) {
      let turn = ang - s.dir; turn -= Math.round(turn / TAU) * TAU;
      if (Math.abs(turn) > 0.001) {
        const side = (turn > 0 ? -1 : 1) * Math.PI / 2;
        g.fillStyle = c0; g.beginPath(); g.moveTo(x0, y0); g.arc(x0, y0, r, s.dir + side, s.dir + turn + side, turn < 0); g.closePath(); g.fill();
      }
    }
    s.dir = ang;
    const grad = g.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, c0); grad.addColorStop(1, c1);
    g.save();
    g.lineWidth = w; g.lineCap = 'butt'; g.strokeStyle = grad;
    if (night()) { g.shadowColor = c1; g.shadowBlur = w * 0.9; }
    // each piece starts a pixel back into the last one (same color there), so the soft edges of two flat ends don't leave a hairline
    const ca = Math.cos(ang), sa = Math.sin(ang);
    g.beginPath(); g.moveTo(x0 - ca, y0 - sa); g.lineTo(x1, y1); g.stroke();
    g.restore();
    g.fillStyle = c1; g.beginPath();
    g.moveTo(x1 + r * sa - ca, y1 - r * ca - sa); g.lineTo(x1 + r * sa, y1 - r * ca);
    g.arc(x1, y1, r, ang - Math.PI / 2, ang + Math.PI / 2);
    g.lineTo(x1 - r * sa - ca, y1 + r * ca - sa); g.closePath(); g.fill();
  }

  // crayon: the same stroke drawn on a scratch canvas, then cut through a fixed paper grain so it looks like wax.
  // The grain is mostly solid with specks of paper showing, so passing over the same spot twice doesn't build up beads.
  let scratch = null, grain = null;
  function crayonGrain() {
    if (grain) return grain;
    const N = 128, t = document.createElement('canvas'); t.width = t.height = N;
    const g = t.getContext('2d'), img = g.createImageData(N, N);
    const C = 16, coarse = Array.from({ length: C * C }, () => Math.random()); // soft blotches, wrapping at the tile edge
    const at = (x, y) => coarse[((y % C + C) % C) * C + ((x % C + C) % C)];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const fx = x / (N / C), fy = y / (N / C), ix = Math.floor(fx), iy = Math.floor(fy), u = fx - ix, v = fy - iy;
      const soft = (at(ix, iy) * (1 - u) + at(ix + 1, iy) * u) * (1 - v) + (at(ix, iy + 1) * (1 - u) + at(ix + 1, iy + 1) * u) * v;
      const n = soft * 0.45 + Math.random() * 0.55;
      const a = 0.2 + 0.8 * Math.max(0, Math.min(1, (n - 0.2) / 0.22)), k = (y * N + x) * 4;
      img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = a * 255;
    }
    g.putImageData(img, 0, 0);
    return grain = g.createPattern(t, 'repeat');
  }

  function paintSegment(s, x, y) {
    dirty = true; wake();
    const d = Math.hypot(x - s.x, y - s.y), w = brushWidth(), crayon = settings.brushStyle === 'crayon';
    // the rainbow shades through a long jump instead of showing one flat color
    const n = settings.brush === 'rainbow' ? Math.max(1, Math.ceil(d / (unit() * 0.04))) : 1;
    let g = pctx, bx = 0, by = 0, bw = 0, bh = 0;
    if (crayon) {
      const pad = w * 1.5;
      bx = Math.max(0, Math.floor((Math.min(s.x, x) - pad) * dpr)); by = Math.max(0, Math.floor((Math.min(s.y, y) - pad) * dpr));
      bw = Math.min(paint.width, Math.ceil((Math.max(s.x, x) + pad) * dpr)) - bx; bh = Math.min(paint.height, Math.ceil((Math.max(s.y, y) + pad) * dpr)) - by;
      if (!scratch) scratch = document.createElement('canvas');
      if (scratch.width < bw || scratch.height < bh) { scratch.width = Math.max(scratch.width, bw); scratch.height = Math.max(scratch.height, bh); }
      g = scratch.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, scratch.width, scratch.height);
      g.setTransform(dpr, 0, 0, dpr, -bx, -by);
    }
    let px = s.x, py = s.y, pc = s.c || strokeColor(s, 0), c = pc;
    if (!s.c) { // round start: just the half circle behind the first piece
      const a0 = Math.atan2(y - s.y, x - s.x); g.fillStyle = pc; g.beginPath(); g.arc(px, py, w / 2, a0 + Math.PI / 2, a0 + Math.PI * 1.5); g.closePath(); g.fill();
    }
    for (let k = 1; k <= n; k++) {
      const qx = s.x + (x - s.x) * k / n, qy = s.y + (y - s.y) * k / n;
      c = strokeColor(s, d / n);
      brushPiece(s, g, px, py, qx, qy, pc, c, w);
      px = qx; py = qy; pc = c;
    }
    s.c = c;
    if (crayon) {
      const pat = crayonGrain(); pat.setTransform(new DOMMatrix().translate(-bx, -by));
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-in'; g.fillStyle = pat; g.fillRect(0, 0, bw, bh); g.globalCompositeOperation = 'source-over';
      pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.drawImage(scratch, 0, 0, bw, bh, bx, by, bw, bh); pctx.restore();
    }
    s.travel += d;
    s.x = x; s.y = y;
    if (s.travel > unit() * 0.09) { s.travel = 0; brushNote(y); }
    if (Math.random() < 0.35) sparks.push({ x, y, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, t: 0, life: 0.5, r: 2 + Math.random() * 3, color: c });
  }

  function addStamp(x, y) {
    dirty = true;
    stampSound();
    // a few set sizes, so the sticker cache gets hits
    stamps.push({ x, y, glyph: pick(STAMPS[settings.stamps] || STAMPS.mix), t: 0, size: unit() * (0.11 + ((Math.random() * 4) | 0) * 0.05 / 3), rot: (Math.random() - 0.5) * 0.5 });
    burst(x, y, 12, unit() * 0.3);
  }

  function burst(x, y, n, speed, color) {
    for (let k = 0; k < n; k++) {
      const a = k / n * TAU;
      sparks.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, t: 0, life: 0.45, r: 3 + Math.random() * 3, color: color || pick(BRIGHT) });
    }
  }

  // ---------- Sticker emoji ----------
  // Same look as the other games: the emoji with a white outline (its silhouette stamped in white at 16 points around a circle)
  // and a soft shadow, drawn once to a small canvas and reused. Cached by glyph and size, rounded up to a multiple of 8px.
  const stickers = new Map(), STICKER_MAX = 24; // a Map keeps insertion order, so the oldest-used one is first
  function sticker(glyph, size) {
    // drawn big enough for the pop-in (1.3x) so it is only ever scaled down
    const em = Math.ceil(size * 1.3 * dpr / 8) * 8, key = glyph + '|' + em;
    let sp = stickers.get(key);
    if (sp) { stickers.delete(key); stickers.set(key, sp); return sp; }
    const o = Math.max(2, em * 0.06), pad = Math.ceil(o + em * 0.08), side = Math.ceil(em * 1.25) + pad * 2, mid = side / 2;
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = side; return c; };
    const glyphAt = g => { g.font = `${em}px ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(glyph, mid, mid); }; // black first: keeps emoji fully opaque
    const sil = mk(), sg = sil.getContext('2d');

  let last = performance.now();
  // a ghost finger sparkles a loop on an empty page, showing that touching makes magic
  let hintT = 0;
  function hintPos(t) {
    const cx = W / 2, cy = H * 0.55, a = unit() * 0.28;
    return { x: cx + Math.sin(t) * a, y: cy + Math.sin(t * 2) * a * 0.45 };
  }
  function update(dt) {
    idle += dt;
    for (let i = fills.length - 1; i >= 0; i--) {
      const f = fills[i]; f.t += dt;
      if (f.t > 0.35) { pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.drawImage(f.fc, f.x0, f.y0, f.fw, f.fh, f.x0, f.y0, f.fw, f.fh); pctx.restore(); giveFillCanvas(f); fills.splice(i, 1); }
    }
    if (blank && idle > 2 && !page) {
      hintT += dt * 1.6;
      const h = hintPos(hintT);
      if (Math.random() < 0.6) sparks.push({ x: h.x, y: h.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, t: 0, life: 0.9, r: 3 + Math.random() * 4, color: `hsl(${(hintT * 60) % 360},95%,60%)` });
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
      if (p.t > p.life) sparks.splice(i, 1);
    }
    for (let i = stamps.length - 1; i >= 0; i--) {
      const s = stamps[i]; s.t += dt;
      // once it has wiggled into place, it becomes part of the picture
      if (s.t > 0.5) { drawStamp(pctx, s, 1); stamps.splice(i, 1); }
    }
  }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(paint, 0, 0);
    for (const f of fills) {
      // the color pours out from the finger
      const k = Math.min(1, f.t / 0.35), r = f.far * (1 - (1 - k) * (1 - k)) + 2;
      ctx.save(); ctx.beginPath(); ctx.arc(f.px, f.py, r, 0, TAU); ctx.clip(); ctx.drawImage(f.fc, f.x0, f.y0, f.fw, f.fh, f.x0, f.y0, f.fw, f.fh); ctx.restore();
    }
    if (page) ctx.drawImage(outline, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const s of stamps) {
      const t = s.t / 0.5;
      // pop in big, wiggle, settle
      const scale = t < 0.4 ? 0.3 + (t / 0.4) * 1.0 : 1.3 - (t - 0.4) / 0.6 * 0.3;
      const wob = Math.sin(t * 20) * 0.15 * (1 - t);
      drawStamp(ctx, { ...s, rot: s.rot + wob }, scale);
    }
    for (const p of sparks) {
      const k = 1 - p.t / p.life;
      ctx.globalAlpha = k; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (blank && idle > 2) {
      // the ghost finger: on a coloring page it taps in a shape with a ripple, on a blank page it loops
      const fade = Math.min(1, (idle - 2) * 2);
      let x, y;
      if (page) {
        const t = (idle % 1.4) / 1.4;
        x = page.cx - page.S * 0.05; y = page.cy + page.S * 0.12;
        ctx.globalAlpha = fade * (1 - t) * 0.8;
        ctx.lineWidth = 4; ctx.strokeStyle = '#ff6fb1'; ctx.beginPath(); ctx.arc(x, y, 10 + t * unit() * 0.08, 0, TAU); ctx.stroke();
        y -= Math.abs(Math.sin(t * Math.PI)) * 8;
      } else ({ x, y } = hintPos(hintT));
      ctx.globalAlpha = fade * 0.85;
      ctx.font = `${Math.max(44, unit() * 0.1)}px ${EMOJI}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#000';
      ctx.fillText('👆', x, y);
      ctx.globalAlpha = 1;
    }
  }
  // The loop sleeps when nothing is moving, so a finished picture costs no battery. Input and anything that changes the picture wakes it.
  let running = true, sleptAt = 0, wakeTimer = 0;
  // a hint finger loops forever once it shows, so that counts as moving
  const busy = () => strokes.size || sparks.length || stamps.length || fills.length || (blank && idle > 2);
  function sleep() {
    running = false; sleptAt = performance.now();
    // on a page nobody has touched yet the hint is due in a moment: wake just in time for it
    if (blank && idle <= 2) wakeTimer = setTimeout(wake, (2 - idle) * 1000 + 30);
  }
  function wake() {
    clearTimeout(wakeTimer);
    if (running) return;
    const now = performance.now();
    idle += (now - sleptAt) / 1000; running = true; last = now;
    requestAnimationFrame(loop);
  }
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt); draw();
    if (busy()) requestAnimationFrame(loop); else sleep();
  }

  // ---------- Grown-up panel (press & hold 1.5s) ----------
  const pb = document.getElementById('parentBtn'), panel = document.getElementById('panel');
  let holdTimer = null;
  const startHold = e => { e.preventDefault(); pb.classList.add('holding'); clearTimeout(holdTimer); holdTimer = setTimeout(openPanel, 1500); };
  const endHold = () => { pb.classList.remove('holding'); clearTimeout(holdTimer); };
  pb.addEventListener('pointerdown', startHold);
  pb.addEventListener('pointerup', endHold); pb.addEventListener('pointerleave', endHold); pb.addEventListener('pointercancel', endHold);

  function openPanel() { endHold(); syncPanel(); panel.classList.add('open'); }
  function syncPanel() {
    for (const k of ['brush', 'stamps', 'paper', 'palette', 'size', 'page'])
      document.querySelectorAll(`#panel [data-${k}]`).forEach(b => b.classList.toggle('on', b.dataset[k] === settings[k]));
    document.querySelectorAll('#panel [data-bstyle]').forEach(b => b.classList.toggle('on', b.dataset.bstyle === (settings.brushStyle === 'crayon' ? 'crayon' : 'smooth')));
    document.getElementById('tSound').classList.toggle('off', !settings.sound);
  }
  for (const k of ['brush', 'stamps', 'paper', 'palette', 'size'])
    document.querySelectorAll(`#panel [data-${k}]`).forEach(b => b.onclick = () => { settings[k] = b.dataset[k]; saveSettings(); applyPaper(); syncPanel(); syncPalette(); if (k === 'paper') drawOutline(); });
  document.querySelectorAll('#panel [data-bstyle]').forEach(b => b.onclick = () => { settings.brushStyle = b.dataset.bstyle; saveSettings(); syncPanel(); });
  document.querySelectorAll('#panel [data-page]').forEach(b => b.onclick = () => { setPage(b.dataset.page); syncPanel(); });

  // ---------- Kid color buttons ----------
  const palette = document.getElementById('palette');
  function syncPalette() {
    palette.classList.toggle('hidden', settings.palette === 'hide');
    syncPages();
    palette.querySelectorAll('button[data-color]').forEach(b => b.classList.toggle('on', b.dataset.color === settings.brush));
  }
  // the picture button flips to the next coloring page (blank, sun, fish, ...)
  palette.querySelector('.page').addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    setPage(PAGE_ORDER[(PAGE_ORDER.indexOf(settings.page) + 1) % PAGE_ORDER.length]); whooshSound();
  });
  palette.querySelectorAll('button[data-color]').forEach((b, i) => b.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    settings.brush = b.dataset.color; saveSettings(); syncPalette();
    if (settings.sound && actx) tone(NOTES[i], actx.currentTime, 0.35, 'triangle', 0.12);
  }));

  // ---------- Picture strip (big screens): tap a picture to color it ----------
  const pagesEl = document.getElementById('pages');
  function bigStrip() { return settings.palette !== 'hide' && Math.min(W, H) >= 700; }
  for (const name of PAGE_ORDER) {
    const b = document.createElement('button');
    b.dataset.page = name; b.setAttribute('aria-label', name || 'Blank paper');
    if (name) {
      const t = document.createElement('canvas'), g = t.getContext('2d');
      t.width = t.height = 120;
      g.setTransform(54, 0, 0, 54, 60, 60); g.lineWidth = 7 / 54; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#2b2d5c';
      drawLines(g, name);
      b.style.backgroundImage = `url(${t.toDataURL()})`;
    } else b.textContent = '🖌️';
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); audio();
      if (name === settings.page) return; // tapping the picture you're on mustn't wipe it
      setPage(name); whooshSound();
    });
    pagesEl.appendChild(b);
  }
  function syncPages() {
    const big = bigStrip();
    pagesEl.classList.toggle('show', big);
    palette.querySelector('.page').style.display = big ? 'none' : ''; // the strip replaces the cycle button
    pagesEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.page === settings.page));
  }
  addEventListener('resize', syncPages);
  syncPalette();
  document.getElementById('tSound').onclick = () => { settings.sound = !settings.sound; saveSettings(); syncPanel(); };
  document.getElementById('tClear').onclick = () => { clearPaint(); saved.delete(settings.page); restoring = null; whooshSound(); blank = true; idle = 0; }; // this page only
  document.getElementById('tSave').onclick = () => {
    // flatten onto the paper color so the saved picture looks like the screen
    const out = document.createElement('canvas'); out.width = paint.width; out.height = paint.height;
    const o = out.getContext('2d');
    o.fillStyle = night() ? '#14163a' : '#fff6e9'; o.fillRect(0, 0, out.width, out.height);
    o.drawImage(paint, 0, 0);
    if (page) o.drawImage(outline, 0, 0);
    const name = `magic-paint-${new Date().toISOString().slice(0, 10)}.png`;
    out.toBlob(blob => {
      // the share sheet is the way to save to Photos on iPad and iPhone; elsewhere, download it
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Magic Paint picture' }).catch(() => {}); return; }
      const a = document.createElement('a');
      a.download = name; a.href = URL.createObjectURL(blob); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
  };
  document.getElementById('tFull').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  };
  document.getElementById('done').onclick = () => { panel.classList.remove('open'); audio(); };

  resize();
  if (settings.page && PAGES[settings.page]) { page = { name: settings.page, ...pageBox() }; drawOutline(); }
  syncPages();
  requestAnimationFrame(loop);

  // Offline support (only works over HTTPS or localhost)
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
