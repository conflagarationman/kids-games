<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#ffe6f0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb24a"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ecf5"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c1d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2b2d5c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#paper)"/>
  <!-- faint paper dots -->
  <g fill="#f3d9c6" opacity="0.6">
    <circle cx="60" cy="430" r="3"/><circle cx="140" cy="470" r="2"/><circle cx="720" cy="60" r="3"/>
    <circle cx="760" cy="300" r="2"/><circle cx="400" cy="30" r="2"/><circle cx="250" cy="40" r="3"/>
  </g>

  <!-- the big rainbow swoosh, painted with a fat round brush -->
  <g fill="none" stroke-linecap="round" stroke-width="34" filter="url(#shadow)">
    <path d="M70 380 C 160 140, 380 120, 470 250 S 700 380, 740 170" stroke="#ff3b3b"/>
    <path d="M70 380 C 160 140, 380 120, 470 250 S 700 380, 740 170" stroke="#ff9a1f" transform="translate(0 34)"/>
    <path d="M70 380 C 160 140, 380 120, 470 250 S 700 380, 740 170" stroke="#f5c800" transform="translate(0 68)"/>
    <path d="M70 380 C 160 140, 380 120, 470 250 S 700 380, 740 170" stroke="#22b84a" transform="translate(0 102)" opacity="0.95"/>
    <path d="M70 380 C 160 140, 380 120, 470 250 S 700 380, 740 170" stroke="#2f7bff" transform="translate(0 136)" opacity="0.9"/>
  </g>
  <!-- a glossy highlight on the paint -->
  <path d="M110 330 C 190 170, 360 160, 440 240" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- paint splats -->
  <g filter="url(#shadow)">
    <path d="M610 410c14-10 30-6 34 8 16-4 26 10 18 22 12 10 4 28-12 26-4 16-24 18-32 6-14 8-30-4-26-18-14-6-12-26 4-28-2-10 6-18 14-16z" fill="#a04dff"/>
    <path d="M120 80c10-8 24-4 26 6 12-2 20 8 14 18 10 8 2 22-10 20-4 12-20 14-26 4-12 6-24-4-20-14-10-4-8-20 4-22-2-8 6-14 12-12z" fill="#ff4fb0"/>
    <circle cx="672" cy="390" r="7" fill="#a04dff"/>
    <circle cx="170" cy="70" r="6" fill="#ff4fb0"/>
  </g>

  <!-- stamps -->
  <g filter="url(#shadow)" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">
    <text x="300" y="110" font-size="78" transform="rotate(-12 300 85)">🦋</text>
    <text x="560" y="150" font-size="70" transform="rotate(10 560 125)">🐸</text>
    <text x="250" y="470" font-size="64" transform="rotate(-8 250 450)">🌻</text>
  </g>
  <path d="M470 380l11 23 25 3-18 17 5 25-23-12-23 12 5-25-18-17 25-3z" fill="#f5c800" stroke="#fff" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M90 230c-14-22 10-40 26-22 16-18 40 0 26 22l-26 26z" fill="#ff3b3b" stroke="#fff" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- the paintbrush, finishing the stroke -->
  <!-- bristle tip sits on the end of the stroke, handle out to the top right -->
  <g transform="translate(728 236) rotate(212) translate(0 52)" filter="url(#shadow)">
    <path d="M-17 0 C -17 -26, -8 -44, 0 -52 C 8 -44, 17 -26, 17 0 Z" fill="#2f7bff"/>
    <rect x="-18" y="0" width="36" height="34" rx="4" fill="url(#ferrule)"/>
    <rect x="-18" y="10" width="36" height="5" fill="#9aa3bd" opacity="0.6"/>
    <path d="M-15 34 L 15 34 L 10 180 Q 0 192 -10 180 Z" fill="url(#handle)"/>
    <path d="M-7 46 L -4 170" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- sparkles of magic -->
  <g fill="#f5c800">
    <path d="M690 90l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
    <path d="M410 70l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ff4fb0"/>
    <path d="M60 470l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#2f7bff"/>
    <path d="M760 460l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#22b84a"/>
  </g>
</svg>
