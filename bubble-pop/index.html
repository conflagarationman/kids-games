<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bubble Pop!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Bubble Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd8ff">
<style>
  :root { --sat: env(safe-area-inset-top); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { background: linear-gradient(180deg, #8fd8ff 0%, #c9b8ff 60%, #ffc6e5 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* Parent button: small, faded, needs a long press so little fingers don't open it */
  #parentBtn { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.35); font-size: 20px; z-index: 3; touch-action: none; }
  #parentBtn .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #ff6fb1; clip-path: inset(0 0 100% 0); }
  #parentBtn.holding .ring { animation: fill 1.5s linear forwards; }
  @keyframes fill { to { clip-path: inset(0 0 0 0); } }

  #panel { position: fixed; inset: 0; background: rgba(43,45,92,.45); display: none; align-items: center; justify-content: center; z-index: 5; }
  #panel.open { display: flex; }
  .card { background: #fff; border-radius: 24px; padding: 20px 22px; width: min(420px, 92%); color: #2b2d5c; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 4px; }
  .card p { margin: 0 0 14px; font-size: 13px; opacity: .7; }
  .label { font-weight: 800; font-size: 14px; margin: 12px 0 6px; }
  .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .modes button, .toggles button, .done { padding: 12px 8px; border-radius: 14px; border: 3px solid transparent; background: #eef0ff; font-weight: 800; font-size: 15px; color: #2b2d5c; cursor: pointer; }
  .modes button.on { border-color: #38c6f4; background: #e3f7ff; }
  .toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .toggles button.off { opacity: .45; }
  .done { width: 100%; margin-top: 16px; background: #ff6fb1; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="parentBtn" aria-label="Grown-up settings (press and hold)">⚙️<span class="ring"></span></button>

<div id="panel">
  <div class="card">
    <h2>Grown-up settings</h2>
    <p>Press and hold the ⚙️ to get back here.</p>
    <div class="label">What's in the bubbles?</div>
    <div class="modes">
      <button data-mode="animals">🐶 Animals</button>
      <button data-mode="colors">🎨 Colors</button>
      <button data-mode="letters">🔤 Letters</button>
      <button data-mode="numbers">🔢 Numbers</button>
      <button data-mode="shapes">⭐ Shapes</button>
      <button data-mode="mix">🌈 Mix it up</button>
    </div>
    <div class="label">Game</div>
    <div class="modes">
      <button data-find="0">🫧 Free popping</button>
      <button data-find="1">🔎 Find it!</button>
    </div>
    <div class="label">Sound</div>
    <div class="toggles">
      <button id="tSound">🔊 Sounds</button>
      <button id="tVoice">🗣️ Voice</button>
      <button id="tFull">⛶ Full screen</button>
    </div>
    <div class="label">Bubble speed</div>
    <div class="modes">
      <button data-speed="0.6">🐢 Slow</button>
      <button data-speed="1">🐇 Normal</button>
      <button data-speed="1.7" style="grid-column: span 2">🚀 Super fast</button>
    </div>
    <button class="done" id="done">Let's play!</button>
  </div>
</div>

<script>
(() => {
  // ---------- Content ----------
  const ANIMALS = [
    ['🐶', 'Dog', 'Woof woof!'], ['🐱', 'Cat', 'Meow!'], ['🐮', 'Cow', 'Moo!'], ['🐷', 'Pig', 'Oink oink!'],
    ['🦆', 'Duck', 'Quack quack!'], ['🐑', 'Sheep', 'Baa!'], ['🦁', 'Lion', 'Roar!'], ['🐸', 'Frog', 'Ribbit!'],
    ['🐴', 'Horse', 'Neigh!'], ['🦉', 'Owl', 'Hoo hoo!'], ['🐵', 'Monkey', 'Ooh ooh ah ah!'], ['🐔', 'Chicken', 'Bawk bawk!'],
    ['🐘', 'Elephant', 'Toot!'], ['🐝', 'Bee', 'Buzz!'], ['🐍', 'Snake', 'Hiss!'], ['🐻', 'Bear', 'Grr!'],
    ['🐳', 'Whale', 'Splash!'], ['🐰', 'Bunny', 'Hop hop!'], ['🐧', 'Penguin', 'Waddle waddle!'], ['🦖', 'Dinosaur', 'Rawr!'],
  ];
  const COLORS = [
    ['Red', '#ff3b3b'], ['Orange', '#ff9a1f'], ['Yellow', '#ffe11f'], ['Green', '#34d058'],
    ['Blue', '#2f7bff'], ['Purple', '#a04dff'], ['Pink', '#ff6fc8'], ['Brown', '#9a5a2c'],
    ['Black', '#222'], ['White', '#fff'],
  ];
  const SHAPES = ['Circle', 'Square', 'Triangle', 'Star', 'Heart', 'Diamond'];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const LETTER_WORDS = { A:'Apple', B:'Ball', C:'Cat', D:'Dog', E:'Egg', F:'Fish', G:'Goat', H:'Hat', I:'Igloo', J:'Juice',
    K:'Kite', L:'Lion', M:'Moon', N:'Nest', O:'Octopus', P:'Pig', Q:'Queen', R:'Rainbow', S:'Sun', T:'Tree', U:'Umbrella',
    V:'Van', W:'Whale', X:'Fox', Y:'Yo-yo', Z:'Zebra' };
  const BRIGHT = ['#ff3b3b', '#ff9a1f', '#f5c800', '#22b84a', '#2f7bff', '#a04dff', '#ff4fb0'];
  const pick = a => a[(Math.random() * a.length) | 0];
  // deal from a shuffled deck so the same thing doesn't come up five times in a row
  const decks = new Map();
  function deal(list) {
    let d = decks.get(list);
    if (!d || !d.length) { d = [...list].sort(() => Math.random() - 0.5); decks.set(list, d); }
    return d.pop();
  }

  function makeItem(mode) {
    if (mode === 'mix') mode = pick(['animals', 'animals', 'colors', 'letters', 'numbers', 'shapes']);
    switch (mode) {
      case 'animals': { const [e, n, s] = deal(ANIMALS); return { kind: 'emoji', glyph: e, say: `${n}! ${s}`, id: 'a' + n, ask: `the ${n.toLowerCase()}` }; }
      case 'colors':  { const [n, c] = deal(COLORS); return { kind: 'color', color: c, say: n + '!', id: 'c' + n, ask: `the ${n.toLowerCase()} one` }; }
      case 'letters': { const l = deal(LETTERS); return { kind: 'text', glyph: l, color: pick(BRIGHT), say: `${l}! ${l} is for ${LETTER_WORDS[l]}`, id: 'l' + l, ask: `the letter ${l}` }; }
      case 'numbers': { const n = 1 + ((Math.random() * 10) | 0); return { kind: 'text', glyph: String(n), color: pick(BRIGHT), say: n + '!', count: n, id: 'n' + n, ask: `number ${n}` }; }
      case 'shapes':  { const s = deal(SHAPES); return { kind: 'shape', shape: s, color: pick(BRIGHT), say: s + '!', id: 's' + s, ask: `the ${s.toLowerCase()}` }; }
    }
  }

  // ---------- Settings (only settings are saved) ----------
  const KEY = 'bubblePop.kids.v1';
  let settings = { mode: 'animals', sound: true, voice: true, speed: 0.6, find: false };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };

  // ---------- Canvas ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, SAT = 0, DPR = 1;
  function resize() {
    const dpr = DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    SAT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0; // notch height, for the Find it badge
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (typeof buildSprites === 'function') buildSprites(); // unit() changed, so the cloud sprites and size buckets change too
  }
  addEventListener('resize', resize);
  const unit = () => Math.min(W, H);

  // ---------- Audio ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  // Major pentatonic, so any run of pops sounds like a little tune
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
  function tone(freq, start, dur, type = 'sine', vol = 0.18) {
    const a = actx; if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(a.destination); o.start(start); o.stop(start + dur + 0.02);
  }
  function popSound() {
    if (!settings.sound || !audio()) return;
    const t = actx.currentTime;
    // the "pop"
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.08);
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.12);
    // the happy note
    tone(pick(NOTES), t + 0.03, 0.45, 'triangle', 0.14);
  }
  function sparkleSound() {
    if (!settings.sound || !audio()) return;
    const t = actx.currentTime;
    tone(pick(NOTES) * 2, t, 0.25, 'sine', 0.05);
  }
  function cheerSound() {
    if (!settings.sound || !audio()) return;
    const t = actx.currentTime;
    [0, 2, 4, 5, 7].forEach((n, i) => tone(NOTES[n], t + i * 0.11, 0.5, 'triangle', 0.13));
  }

  // ---------- Voice ----------
  let voice = null;
  function chooseVoice() {
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('en'));
    voice = vs.find(v => /samantha|karen|female|zira|aria|jenny|google us english/i.test(v.name)) || vs[0] || null;
  }
  if ('speechSynthesis' in window) { chooseVoice(); speechSynthesis.onvoiceschanged = chooseVoice; }
  function say(text) {
    if (!settings.voice || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel(); // always say the newest thing, never a backlog
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 0.9; u.pitch = 1.3;
    speechSynthesis.speak(u);
  }

  // ---------- Entities ----------
  const bubbles = [], particles = [], reveals = [], confetti = [];
  let popCount = 0;

  // Bubble size has a floor for small fingers and a ceiling so big screens get more bubbles, not giant ones
  const baseR = () => Math.max(36, Math.min(80, unit() * 0.095));
  // about a fifth of the screen covered in bubbles, whatever its size
  const maxBubbles = () => Math.max(8, Math.min(18, Math.round((W * H * 0.22) / (Math.PI * baseR() ** 2))));
  // rise speed is a share of the screen height, so a trip takes the same time on a phone or a monitor
  const RISE = [0.055, 0.095];
  let spawned = 0;

  // pick the spot along the bottom that is furthest from bubbles already rising there
  function openX(r) {
    let best = W / 2, bestGap = -Infinity;
    for (let k = 0; k < 8; k++) {
      const x = r + Math.random() * Math.max(1, W - 2 * r);
      let gap = Infinity;
      for (const b of bubbles) if (b.y > H * 0.55) gap = Math.min(gap, Math.abs(b.x - x) - b.r - r);
      if (gap > bestGap) { bestGap = gap; best = x; }
    }
    return best;
  }

  function spawnBubble(x, y, opts = {}) {
    // every so often a giant bubble that bursts into little ones
    const giant = opts.giant ?? (++spawned % 11 === 0);
    const r = opts.r ?? baseR() * (giant ? 1.75 : 0.8 + Math.random() * 0.45);
    bubbles.push({
      x: x ?? openX(r),
      y: y ?? (H + r),
      r, giant, item: newItem(),
      vx: opts.vx || 0,
      vy: opts.vy ?? -(H * (RISE[0] + Math.random() * (RISE[1] - RISE[0]))) * (giant ? 0.7 : 1),
      phase: Math.random() * Math.PI * 2,
      hue: (Math.random() * 360) | 0,
      born: performance.now(),
    });
  }

  function addConfetti(x, y, spreadX, minVy) {
    confetti.push({ x, y, vx: (Math.random() - 0.5) * spreadX, vy: minVy + Math.random() * 160, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 5, color: pick(BRIGHT), t: 0 });
  }

  // ---------- Find it: "Pop the red one!" ----------
  // Off by default (it has a right answer). A wrong pop still pops and says its name: nothing to fail.
  let target = null, found = 0, wrongRun = 0, askedAt = 0, hintGlow = 0;
  const copyOf = t => ({ ...t, color: t.kind === 'color' ? t.color : pick(BRIGHT) });
  function newItem() {
    return settings.find && target && Math.random() < 0.3 ? copyOf(target) : makeItem(settings.mode);
  }
  function ask() { if (target) { say(`Pop ${target.ask}!`); askedAt = performance.now(); } }
  function newTarget() {
    if (!settings.find) { target = null; return; }
    let t; do { t = makeItem(settings.mode); } while (target && t.id === target.id && settings.mode !== 'numbers');
    target = t; wrongRun = 0; hintGlow = 0;
    // make sure a couple are already on screen, in easy reach
    const mid = bubbles.filter(b => b.y > H * 0.3 && b.y < H * 0.85 && !b.giant).sort(() => Math.random() - 0.5);
    for (const b of mid.slice(0, 2)) b.item = copyOf(target);
    ask();
  }
  function foundIt(b) {
    found++; wrongRun = 0; hintGlow = 0;
    say(`Yes! ${b.item.say}`);
    cheerSound();
    for (let k = 0; k < (found % 5 === 0 ? 140 : 50); k++) {
      addConfetti(b.x + (Math.random() - 0.5) * W * 0.4, b.y - Math.random() * H * 0.3, 120, 60);
    }
    const was = target; target = null;
    setTimeout(() => { if (settings.find && !target) { target = was; newTarget(); } }, 1600);
  }

  function popBubble(i) {
    const b = bubbles.splice(i, 1)[0];
    popCount++;
    popSound();
    const isTarget = settings.find && target && b.item.id === target.id;
    if (isTarget) foundIt(b);
    else {
      say(b.item.say);
      // after a few misses, ask again and make the right ones shimmer
      if (settings.find && target && ++wrongRun >= 3) { wrongRun = 0; hintGlow = 1; setTimeout(ask, 900); }
    }
    const n = 18;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      const sp = unit() * (0.25 + Math.random() * 0.35);
      particles.push({ x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        t: 0, life: 0.6, r: 3 + Math.random() * 5, hue: (b.hue + k * 20) % 360 });
    }
    reveals.push({ x: b.x, y: b.y, r: b.r, item: b.item, t: 0 });
    if (b.giant) {
      // a giant bubble bursts into four little bubbles that scatter
      for (let k = 0; k < 4; k++) {
        const a = -Math.PI / 2 + (k - 1.5) * 0.9, sp = unit() * 0.5;
        spawnBubble(b.x, b.y, { giant: false, r: baseR() * 0.7, vx: Math.cos(a) * sp, vy: -H * RISE[1] * 1.2 });
      }
    }
    if (!settings.find && popCount % 12 === 0) celebrate();
    // keep the screen lively: a fresh bubble arrives soon after each pop
    setTimeout(() => { if (bubbles.length < maxBubbles()) spawnBubble(); }, 400);
  }

  function celebrate() {
    setTimeout(() => {
      cheerSound();
      say(pick(['Hooray!', 'Yay! Great popping!', 'Wow! You did it!', 'Super popper!']));
      for (let k = 0; k < 120; k++) {
        addConfetti(Math.random() * W, -20 - Math.random() * H * 0.5, 60, 120);
      }
    }, 900);
  }

  // ---------- Input: every finger counts, swiping pops too ----------
  const down = new Set();
  function hit(x, y) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      // generous hit zone for small, imprecise fingers
      if ((b.x - x) ** 2 + (b.y - y) ** 2 <= (b.r * 1.25 + 14) ** 2) return i;
    }
    return -1;
  }
  function touch(x, y, isTap) {
    const i = hit(x, y);
    if (i >= 0) { popBubble(i); return; }
    if (isTap) {
      // tapping empty sky still does something nice
      sparkleSound();
      for (let k = 0; k < 10; k++) {
        const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 90;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 0.5, r: 2 + Math.random() * 3, hue: (Math.random() * 360) | 0, star: true });
      }
      if (bubbles.length < maxBubbles() + 2) spawnBubble(x, H + unit() * 0.15);
    }
  }
  let spoke = false; // iOS only lets the page talk after a touch, so the first question is asked again then
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio(); down.add(e.pointerId);
    if (!spoke) { spoke = true; if (settings.find && target) setTimeout(ask, 700); }
    touch(e.clientX, e.clientY, true);
  });
  cv.addEventListener('pointermove', e => { if (down.has(e.pointerId)) touch(e.clientX, e.clientY, false); });
  const lift = e => down.delete(e.pointerId);
  addEventListener('pointerup', lift); addEventListener('pointercancel', lift);
  addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch zoom

  // ---------- Drawing ----------
  function shapePath(c, shape, x, y, s) {
    c.beginPath();
    switch (shape) {
      case 'Circle': c.arc(x, y, s, 0, Math.PI * 2); break;
      case 'Square': c.rect(x - s * 0.85, y - s * 0.85, s * 1.7, s * 1.7); break;
      case 'Triangle': c.moveTo(x, y - s); c.lineTo(x + s * 0.95, y + s * 0.75); c.lineTo(x - s * 0.95, y + s * 0.75); c.closePath(); break;
      case 'Diamond': c.moveTo(x, y - s); c.lineTo(x + s * 0.75, y); c.lineTo(x, y + s); c.lineTo(x - s * 0.75, y); c.closePath(); break;
      case 'Star':
        for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? s * 0.45 : s; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        c.closePath(); break;
      case 'Heart':
        c.moveTo(x, y + s * 0.85);
        c.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.2, x, y - s * 0.45);
        c.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.1, x, y + s * 0.85); break;
    }
  }

  // ---------- Sprites ----------
  // Every look is painted once to an offscreen canvas and then drawn scaled with drawImage.
  // buildSprites() clears and rebuilds all of it: call it again whenever the fonts change.
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const TEXT_FONT = '"Arial Rounded MT Bold","Trebuchet MS",sans-serif';
  const HUES = 12, STEP = 8; // iridescent hue buckets, and size buckets in css px
  const bodySprites = new Map(), itemSprites = new Map();
  let cloudSprites = [];
  function makeSprite(side) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(side * DPR);
    const g = c.getContext('2d'); g.scale(DPR, DPR);
    return { c, g, side };
  }
  const bucket = r => Math.max(STEP, Math.ceil(r / STEP) * STEP); // round up so a sprite is only ever scaled down

  function paintBody(g, cx, cy, r, tint, hue) {
    const grad = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    if (tint) {
      grad.addColorStop(0, 'rgba(255,255,255,0.7)'); grad.addColorStop(0.35, tint); grad.addColorStop(1, tint);
    } else {
      grad.addColorStop(0, 'rgba(255,255,255,0.6)');
      grad.addColorStop(0.7, `hsla(${hue},90%,80%,0.25)`);
      grad.addColorStop(0.92, `hsla(${hue + 50},95%,72%,0.6)`);
      grad.addColorStop(1, `hsla(${hue + 100},95%,82%,0.9)`);
    }
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = grad; g.fill();
    g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.8)'; g.stroke();
  }
  // the bubble body (gradient + rim) at radius R, keyed by tint or hue bucket
  function bodySprite(b, R) {
    const tint = b.item.kind === 'color' ? b.item.color : null;
    const h = Math.round(b.hue / (360 / HUES)) % HUES;
    const key = (tint || h) + '|' + R;
    let sp = bodySprites.get(key);
    if (!sp) {
      if (bodySprites.size > 300) bodySprites.clear();
      sp = makeSprite(R * 2 + 6);
      paintBody(sp.g, sp.side / 2, sp.side / 2, R, tint, h * (360 / HUES));
      bodySprites.set(key, sp);
    }
    return sp;
  }

  function paintItem(g, item, x, y, size) {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (item.kind === 'emoji') {
      g.fillStyle = '#000'; // color emoji take on the fill's transparency, so keep it solid
      g.font = `${size * 1.2}px ${EMOJI_FONT}`;
      g.fillText(item.glyph, x, y + size * 0.08);
    } else if (item.kind === 'text') {
      g.font = `900 ${size * 1.3}px ${TEXT_FONT}`;
      g.lineWidth = size * 0.14; g.strokeStyle = '#fff'; g.lineJoin = 'round';
      g.strokeText(item.glyph, x, y + size * 0.06);
      g.fillStyle = item.color; g.fillText(item.glyph, x, y + size * 0.06);
    } else if (item.kind === 'shape') {
      shapePath(g, item.shape, x, y, size * 0.6);
      g.fillStyle = item.color; g.fill();
      g.lineWidth = size * 0.08; g.strokeStyle = '#fff'; g.lineJoin = 'round'; g.stroke();
    }
  }
  function itemSprite(item, S) {
    const key = item.kind + '|' + (item.glyph || item.shape) + '|' + (item.color || '') + '|' + S;
    let sp = itemSprites.get(key);
    if (!sp) {
      if (itemSprites.size > 400) itemSprites.clear();
      sp = makeSprite(S * 2.4);
      paintItem(sp.g, item, sp.side / 2, sp.side / 2, S);
      itemSprites.set(key, sp);
    }
    return sp;
  }
  function drawItem(item, x, y, size, alpha) {
    if (item.kind === 'color') return;
    const S = bucket(size), sp = itemSprite(item, S), k = size / S, w = sp.side * k;
    ctx.globalAlpha = alpha;
    ctx.drawImage(sp.c, x - w / 2, y - w / 2, w, w);
    ctx.globalAlpha = 1;
  }

  // soft clouds drifting behind the bubbles, so the sky has some depth
  const CLOUDS = Array.from({ length: 5 }, (_, i) => ({ y: 0.08 + i * 0.17 + Math.random() * 0.06, s: 0.7 + Math.random() * 0.6, x: Math.random(), v: 0.006 + Math.random() * 0.008 }));
  // one opaque white cloud per sprite: drawn with globalAlpha, so overlapping lobes can't leave seams
  const CLOUD_BOX = { l: 1.1, t: 1.75, w: 4.4, h: 3 }; // in units of s, around the cloud's left-middle origin
  function paintCloud(s) {
    const sp = makeSprite(0), w = CLOUD_BOX.w * s, h = CLOUD_BOX.h * s;
    sp.c.width = Math.ceil(w * DPR); sp.c.height = Math.ceil(h * DPR);
    const g = sp.c.getContext('2d'); g.scale(DPR, DPR);
    const ox = CLOUD_BOX.l * s, oy = CLOUD_BOX.t * s;
    g.fillStyle = '#fff'; g.beginPath();
    g.arc(ox, oy, s, 0, 7); g.moveTo(ox + s * 2.35, oy - s * 0.45); g.arc(ox + s * 1.1, oy - s * 0.45, s * 1.25, 0, 7);
    g.moveTo(ox + s * 3.25, oy); g.arc(ox + s * 2.3, oy, s * 0.95, 0, 7);
    g.moveTo(ox + s * 2.7, oy + s * 0.25); g.ellipse(ox + s * 1.15, oy + s * 0.25, s * 1.55, s * 0.8, 0, 0, 7); // rounded base instead of a flat edge
    g.fill();
    return { c: sp.c, w, h, ox, oy };
  }

  function buildSprites() {
    bodySprites.clear(); itemSprites.clear();
    cloudSprites = CLOUDS.map(c => paintCloud(unit() * 0.13 * c.s));
    // warm the common bubble looks so the first pops don't hitch
    const r0 = baseR();
    for (const k of [0.7, 0.8, 1, 1.25, 1.75]) {
      const R = bucket(r0 * k + 2);
      for (let h = 0; h < HUES; h++) bodySprite({ hue: h * (360 / HUES), item: { kind: 'emoji' } }, R);
    }
  }

  function drawClouds(now) {
    ctx.globalAlpha = 0.45;
    CLOUDS.forEach((c, i) => {
      const sp = cloudSprites[i], s = unit() * 0.13 * c.s, span = W + s * 5;
      const x = ((c.x + now / 1000 * c.v) % 1) * span - s * 2.5, y = c.y * H;
      ctx.drawImage(sp.c, x - sp.ox, y - sp.oy, sp.w, sp.h);
    });
    ctx.globalAlpha = 1;
  }

  function drawBubble(b, now) {
    const grow = Math.min(1, (now - b.born) / 300);
    const r = b.r * (0.5 + 0.5 * grow) * (1 + Math.sin(b.phase * 1.6) * 0.035);
    if (hintGlow && target && b.item.id === target.id) {
      // a gentle golden shimmer on the ones we're looking for
      const k = 0.5 + 0.5 * Math.sin(now / 180);
      ctx.beginPath(); ctx.arc(b.x, b.y, r * (1.12 + k * 0.08), 0, Math.PI * 2);
      ctx.lineWidth = 6; ctx.strokeStyle = `rgba(255,210,63,${0.5 + k * 0.5})`; ctx.stroke();
    }
    const R = bucket(b.r * 1.04 + 2), sp = bodySprite(b, R), k = r / R, w = sp.side * k;
    ctx.drawImage(sp.c, b.x - w / 2, b.y - w / 2, w, w);
    if (b.item.kind !== 'color') drawItem(b.item, b.x, b.y, r * 0.75, 0.95);
    ctx.beginPath(); ctx.ellipse(b.x - r * 0.4, b.y - r * 0.45, r * 0.22, r * 0.11, -0.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  }

  // ---------- Loop ----------
  let last = performance.now(), spawnT = 0;
  function update(dt) {
    const sp = settings.speed;
    // nobody's found it for a while: ask again and shimmer the right ones
    if (settings.find && target && performance.now() - askedAt > 12000) { hintGlow = 1; ask(); }
    spawnT -= dt;
    // the timer keeps a steady stream; the cap is only a ceiling for when lots of taps add extras
    if (spawnT <= 0 && bubbles.length < maxBubbles() + 4) {
      spawnBubble();
      // space arrivals so the screen stays about full: one trip's time shared across the bubbles
      const trip = 1 / ((RISE[0] + RISE[1]) / 2) / sp;
      spawnT = (trip / maxBubbles()) * (0.6 + Math.random() * 0.8);
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.phase += dt * 1.5;
      b.x += (Math.sin(b.phase) * 20 + b.vx) * dt;
      b.vx *= 0.96; // the scatter from a giant pop slows to a drift
      b.y += b.vy * sp * dt;
      b.x = Math.max(b.r, Math.min(W - b.r, b.x));
      if (b.y < -b.r * 1.5) bubbles.splice(i, 1);
    }
    for (let i = 0; i < bubbles.length; i++) for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i], b = bubbles[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, overlap = a.r + b.r - d;
      if (overlap > 0) { const push = Math.min(overlap, 120 * dt) / 2; a.x -= dx / d * push; b.x += dx / d * push; a.y -= dy / d * push * 0.5; b.y += dy / d * push * 0.5; }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
      if (p.t > p.life) particles.splice(i, 1);
    }
    for (let i = reveals.length - 1; i >= 0; i--) { const r = reveals[i]; r.t += dt; r.y -= unit() * 0.05 * dt; if (r.t > 1.6) reveals.splice(i, 1); }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i]; c.t += dt; c.x += (c.vx + Math.sin(c.t * 3 + c.rot) * 40) * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      if (c.y > H + 30) confetti.splice(i, 1);
    }
  }

  function draw() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    drawClouds(now);
    for (const b of bubbles) drawBubble(b, now);
    for (const p of particles) {
      const k = 1 - p.t / p.life;
      ctx.fillStyle = `hsla(${p.hue},95%,${p.star ? 90 : 75}%,${k})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, Math.PI * 2); ctx.fill();
    }
    // the surprise from inside the bubble: pops up big, wiggles, floats away
    for (const r of reveals) {
      const t = r.t;
      const scale = t < 0.25 ? 0.5 + (t / 0.25) * 0.9 : 1.4 - Math.min(0.2, (t - 0.25) * 0.4);
      const alpha = t > 1.1 ? Math.max(0, 1 - (t - 1.1) / 0.5) : 1;
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(Math.sin(t * 12) * 0.12 * Math.max(0, 1 - t));
      const size = r.r * scale;
      if (r.item.kind === 'color') {
        ctx.globalAlpha = alpha;
        ctx.beginPath(); ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2); ctx.fillStyle = r.item.color; ctx.fill();
        ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
      } else {
        drawItem(r.item, 0, 0, size, alpha);
      }
      // numbers: show that many dots so counting is concrete
      if (r.item.count) {
        ctx.globalAlpha = alpha; ctx.fillStyle = r.item.color;
        const n = r.item.count, dot = Math.max(5, size * 0.09), gap = dot * 2.6, perRow = Math.min(n, 5);
        for (let k = 0; k < n; k++) {
          const row = (k / 5) | 0, col = k % 5, inRow = row === 0 ? perRow : n - 5;
          ctx.beginPath(); ctx.arc((col - (inRow - 1) / 2) * gap, size * 0.95 + row * gap, dot, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }
    for (const c of confetti) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
    }
    if (settings.find && target) drawTargetBadge(now);
  }

  // top-center card showing what to find, so it works with the voice off too
  function drawTargetBadge(now) {
    const s = Math.max(40, Math.min(64, unit() * 0.13)), w = s * 2.3, h = s * 1.35;
    const x = W / 2, y = 10 + h / 2 + SAT;
    const bob = 1 + Math.sin(now / 300) * 0.03;
    ctx.save(); ctx.translate(x, y); ctx.scale(bob, bob);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.shadowColor = 'rgba(43,45,92,.25)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-w / 2, -h / 2, w, h, h / 2) : ctx.rect(-w / 2, -h / 2, w, h); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#000'; ctx.font = `${s * 0.6}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🔎', -w / 2 + s * 0.6, s * 0.04);
    if (target.kind === 'color') {
      ctx.beginPath(); ctx.arc(s * 0.35, 0, s * 0.42, 0, Math.PI * 2); ctx.fillStyle = target.color; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(43,45,92,.3)'; ctx.stroke();
    } else drawItem(target, s * 0.35, 0, s * 0.62, 1);
    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  // ---------- Grown-up panel (press & hold 1.5s) ----------
  const pb = document.getElementById('parentBtn'), panel = document.getElementById('panel');
  let holdTimer = null;
  const startHold = e => { e.preventDefault(); clearTimeout(holdTimer); pb.classList.add('holding'); holdTimer = setTimeout(openPanel, 1500); };
  const endHold = () => { pb.classList.remove('holding'); clearTimeout(holdTimer); };
  pb.addEventListener('pointerdown', startHold);
  pb.addEventListener('pointerup', endHold); pb.addEventListener('pointerleave', endHold); pb.addEventListener('pointercancel', endHold);

  function openPanel() { endHold(); syncPanel(); panel.classList.add('open'); }
  function syncPanel() {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === settings.mode));
    document.querySelectorAll('[data-find]').forEach(b => b.classList.toggle('on', +b.dataset.find === +settings.find));
    document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === settings.speed));
    document.getElementById('tSound').classList.toggle('off', !settings.sound);
    document.getElementById('tVoice').classList.toggle('off', !settings.voice);
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    settings.mode = b.dataset.mode; saveSettings(); syncPanel();
    for (const bb of bubbles) bb.item = makeItem(settings.mode); // switch what's on screen right away
    target = null; newTarget();
  });
  document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { settings.speed = +b.dataset.speed; saveSettings(); syncPanel(); });
  document.getElementById('tSound').onclick = () => { settings.sound = !settings.sound; saveSettings(); syncPanel(); };
  document.querySelectorAll('[data-find]').forEach(b => b.onclick = () => { settings.find = b.dataset.find === '1'; saveSettings(); syncPanel(); target = null; newTarget(); });
  document.getElementById('tVoice').onclick = () => { settings.voice = !settings.voice; saveSettings(); syncPanel(); };
  document.getElementById('tFull').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  };
  document.getElementById('done').onclick = () => { panel.classList.remove('open'); audio(); };

  resize(); // sizes the canvas and builds the sprites
  // start with the sky already full
  for (let i = 0, n = maxBubbles(); i < n; i++) spawnBubble(undefined, H * (0.1 + 0.9 * (i + Math.random()) / n), { giant: false });
  newTarget();
  requestAnimationFrame(loop);
  // ?debug: a read-only snapshot for automated testing
  if (/[?&]debug/.test(location.search)) window.__bubblePop = () => ({ target: target && target.id, found, bubbles: bubbles.length,
    targets: bubbles.filter(b => target && b.item.id === target.id).map(b => ({ x: b.x, y: b.y })) });

  // Offline support (only works over HTTPS or localhost)
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
