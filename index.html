<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Games</title>
<meta name="theme-color" content="#8fd8ff">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #2b2d5c; }
  body { background: linear-gradient(180deg, #8fd8ff 0%, #c9b8ff 60%, #ffc6e5 100%); background-attachment: fixed; padding: 32px 16px; }
  h1 { text-align: center; font-size: clamp(32px, 8vw, 56px); margin: 0 0 24px; color: #fff; text-shadow: 0 3px 0 #ff6fb1; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
  a.game { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; border-radius: 24px; background: rgba(255,255,255,.85); text-decoration: none; color: inherit; box-shadow: 0 8px 24px rgba(43,45,92,.15); transition: transform .15s; }
  a.game:active { transform: scale(.96); }
  a.game img { width: 120px; height: 120px; border-radius: 26px; }
  a.game b { font-size: 22px; }
  a.game span { font-size: 14px; opacity: .7; text-align: center; }
</style>
</head>
<body>
<h1>Kids Games</h1>
<div class="games">
  <a class="game" href="bubble-pop/">
    <img src="bubble-pop/icon-192.png" alt="">
    <b>Bubble Pop!</b>
    <span>Pop bubbles to find animals, colors, letters, numbers and shapes</span>
  </a>
  <a class="game" href="magic-paint/">
    <img src="magic-paint/icon-192.png" alt="">
    <b>Magic Paint!</b>
    <span>Finger paint in rainbow colors and tap to drop stamps</span>
  </a>
  <a class="game" href="little-band/">
    <img src="little-band/icon-192.png" alt="">
    <b>Little Band!</b>
    <span>Tap the animal band to make music, with no wrong notes</span>
  </a>
</div>
</body>
</html>
