<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Games</title>
<meta name="theme-color" content="#8fd8ff">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #2b2d5c; }
  body {
    background: linear-gradient(180deg, #8fd8ff 0%, #c9b8ff 60%, #ffc6e5 100%); background-attachment: fixed;
    padding: calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  header { text-align: center; margin: 0 auto 24px; }
  h1 { font-size: clamp(36px, 9vw, 64px); margin: 0; color: #fff; text-shadow: 0 4px 0 #ff6fb1, 0 8px 18px rgba(43,45,92,.2); letter-spacing: .5px; }
  header p { margin: 6px 0 0; font-size: clamp(15px, 3.6vw, 19px); font-weight: 700; color: #fff; opacity: .95; text-shadow: 0 1px 4px rgba(43,45,92,.25); }

  .games { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 520px; margin: 0 auto; }
  @media (min-width: 700px) { .games { grid-template-columns: repeat(2, 1fr); max-width: 900px; gap: 24px; } }
  @media (min-width: 1100px) { .games { grid-template-columns: repeat(3, 1fr); max-width: 1240px; gap: 28px; } body { padding-top: calc(6vh + env(safe-area-inset-top)); } }

  a.game { display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; background: #fff; text-decoration: none; color: inherit;
    box-shadow: 0 10px 30px rgba(43,45,92,.16), 0 2px 6px rgba(43,45,92,.08); transition: transform .18s ease, box-shadow .18s ease; }
  a.game:active { transform: scale(.97); }
  @media (hover: hover) { a.game:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(43,45,92,.22), 0 3px 8px rgba(43,45,92,.1); } }

  .cover { position: relative; aspect-ratio: 8 / 5; background: var(--tint); }
  .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .play { position: absolute; right: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px 9px 14px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 4px 12px rgba(43,45,92,.25); }
  .play::before { content: ""; width: 0; height: 0; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }

  .info { display: flex; align-items: center; gap: 14px; padding: 0 18px 18px; }
  .info img { width: 72px; height: 72px; border-radius: 18px; margin-top: -26px; border: 4px solid #fff; box-shadow: 0 4px 12px rgba(43,45,92,.2); flex: none; }
  .info div { padding-top: 12px; min-width: 0; }
  .info b { display: block; font-size: 22px; }
  .info span { display: block; font-size: 14px; line-height: 1.35; opacity: .7; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1>Kids Games</h1>
  <p>Tap a game to play</p>
</header>
<main class="games">
  <a class="game" href="bubble-pop/" style="--accent: #ff6fb1; --tint: #c3b4ff">
    <div class="cover"><img src="bubble-pop/cover.svg" alt="Bubbles floating with a puppy, a chick, a letter, a number and a star inside"><span class="play">Play</span></div>
    <div class="info">
      <img src="bubble-pop/icon-192.png" alt="">
      <div><b>Bubble Pop!</b><span>Pop bubbles to find animals, colors, letters, numbers and shapes</span></div>
    </div>
  </a>
  <a class="game" href="magic-paint/" style="--accent: #a04dff; --tint: #fff1e8">
    <div class="cover"><img src="magic-paint/cover.svg" alt="A paintbrush finishing a rainbow swoosh with stamps around it"><span class="play">Play</span></div>
    <div class="info">
      <img src="magic-paint/icon-192.png" alt="">
      <div><b>Magic Paint!</b><span>Finger paint in rainbow colors and tap to drop stamps</span></div>
    </div>
  </a>
  <a class="game" href="little-band/" style="--accent: #2f9bff; --tint: #ffbf95">
    <div class="cover"><img src="little-band/cover.svg" alt="A colorful keyboard with a drum, trumpet, guitar and bell playing along"><span class="play">Play</span></div>
    <div class="info">
      <img src="little-band/icon-192.png" alt="">
      <div><b>Little Band!</b><span>Play a real piano, bells, guitar or horn, plus drum and clap</span></div>
    </div>
  </a>
</main>
</body>
</html>
